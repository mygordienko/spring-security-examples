<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User page</title>
</head>
<body>
<h1>User page</h1>

<p>This page requires <code>ROLE_USER</code>, which both mapped local accounts have.</p>

<p>OIDC subject: <strong th:text="${subject}">userA</strong></p>
<p>Local authorities:
    <span th:each="authority, iteration : ${authorities}"
          th:text="${authority} + ${iteration.last ? '' : ', '}">ROLE_USER</span>
</p>

<p><a th:href="@{/restricted}">Try the admin-only page</a></p>
<p><a th:href="@{/}">Back to home</a></p>
</body>
</html>
