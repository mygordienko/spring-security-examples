<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restricted page</title>
</head>
<body>
<h1>Restricted page</h1>

<p>This page requires <code>ROLE_ADMIN</code>, which only the local account of <code>userB</code> has.</p>

<p>OIDC subject: <strong th:text="${subject}">userB</strong></p>
<p>Local authorities:
    <span th:each="authority, iteration : ${authorities}"
          th:text="${authority} + ${iteration.last ? '' : ', '}">ROLE_USER, ROLE_ADMIN</span>
</p>

<p><a th:href="@{/}">Back to home</a></p>
</body>
</html>
