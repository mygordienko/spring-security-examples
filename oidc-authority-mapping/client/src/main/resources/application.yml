server:
  port: 8082

spring:
  application:
    name: oidc-authority-mapping-client
  security:
    oauth2:
      client:
        provider:
          authority-mapping-provider:
            authorization-uri: http://auth.local:9100/oauth2/authorize
            token-uri: http://auth.local:9100/oauth2/token
            jwk-set-uri: http://auth.local:9100/oauth2/jwks
            user-info-uri: http://auth.local:9100/userinfo
            user-name-attribute: sub
        registration:
          authority-mapping-client:
            provider: authority-mapping-provider
            client-id: authority-mapping-client
            client-secret: secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: http://127.0.0.1:8082/login/oauth2/code/{registrationId}
            scope:
              - openid
              - profile

app:
  local-users:
    - subject: userA
      authorities:
        - ROLE_USER
    - subject: userB
      authorities:
        - ROLE_USER
        - ROLE_ADMIN
